# Weekly catalog refresh against current USGS holdings, delivered as a PR.
#
# Extends the original create-all-based version of this workflow: in addition
# to building STAC for new project folders, scripts/refresh_catalog.py also
# rebuilds projects whose tile set drifted (tiles added/removed in place,
# restaged data), prunes projects deleted upstream, and validates with
# guardrails + HTTP HEAD spot checks before the PR is opened (see the script
# docstring). Release assets are cut by release.yml when the PR merges.
name: Update Catalog

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the diff only; do not rebuild or open a PR"
        type: boolean
        default: false
      allow_large_removals:
        description: "Override the max-removed-tiles guardrail (after reviewing a dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    # a refresh can rebuild many projects, each hitting titiler per TIFF
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true

      # Diff catalog/ against a paginated S3 listing; build new projects,
      # rebuild changed ones, prune deleted ones; abort on guardrail or
      # HEAD-check failures (nothing is committed by this step either way)
      - name: Refresh catalog from S3 holdings
        id: refresh
        run: |
          ARGS="--summary refresh_summary.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.allow_large_removals }}" = "true" ]; then
            ARGS="$ARGS --allow-large-removals"
          fi
          pixi run refresh $ARGS

      - name: Summarize changes
        if: always()
        run: |
          echo "## Catalog refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f refresh_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat refresh_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "refresh_summary.json not produced (guardrail/validation failure -- see log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Warn on per-project build failures
        if: steps.refresh.outputs.n_failures != '' && steps.refresh.outputs.n_failures != '0'
        run: |
          echo "::warning::${{ steps.refresh.outputs.n_failures }} project build(s) failed (likely WESM name mismatch -- see scripts/create_static_stac.py onemeter_folder_to_wesm)"

      - name: Open pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            catalog
            collections.txt
          branch: update-catalog
          delete-branch: true
          commit-message: "Refresh catalog: ${{ steps.refresh.outputs.changelog }}"
          title: "Update catalog (${{ steps.refresh.outputs.changelog }})"
          body: |
            Automated weekly run of `pixi run refresh` (S3 diff, incremental
            rebuild, prune, HEAD validation -- see `scripts/refresh_catalog.py`).

            ```
            ${{ steps.refresh.outputs.changelog }}
            ```

            Catalog items after refresh: ${{ steps.refresh.outputs.n_items }}.
            Full diff summary in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Merging this PR triggers `release.yml`, which rebuilds
            `catalog.parquet`/`catalog.gti` and publishes a dated release.
