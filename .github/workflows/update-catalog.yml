# Weekly catalog refresh against current USGS holdings, delivered as a PR.
#
# Extends the original create-all-based version of this workflow: in addition
# to building STAC for new project folders, scripts/refresh_catalog.py also
# rebuilds projects whose tile set drifted (tiles added/removed in place,
# restaged data), prunes projects deleted upstream, refreshes collections whose
# WESM metadata was revised without touching tiles, and validates with
# guardrails + HTTP HEAD spot checks before the PR is opened (see the script
# docstring). Release assets are cut by release.yml (monthly cron or manual
# dispatch, skipping when the catalog is unchanged since the latest release).
name: Update Catalog

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report the diff only; do not rebuild or open a PR"
        type: boolean
        default: false
      allow_large_removals:
        description: "Override the max-removed-tiles guardrail (after reviewing a dry run)"
        type: boolean
        default: false
      allow_large_metadata_updates:
        description: "Override the max-metadata-updates guardrail (after reviewing a dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    # a refresh can rebuild many projects, each hitting titiler per TIFF
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true

      # Diff catalog/ against a paginated S3 listing; build new projects,
      # rebuild changed ones, prune deleted ones; abort on guardrail or
      # HEAD-check failures (nothing is committed by this step either way)
      - name: Refresh catalog from S3 holdings
        id: refresh
        run: |
          ARGS="--summary refresh_summary.json --pr-body pr_body.md"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.allow_large_removals }}" = "true" ]; then
            ARGS="$ARGS --allow-large-removals"
          fi
          if [ "${{ inputs.allow_large_metadata_updates }}" = "true" ]; then
            ARGS="$ARGS --allow-large-metadata-updates"
          fi
          pixi run refresh $ARGS

      - name: Summarize changes
        if: always()
        run: |
          echo "## Catalog refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f refresh_summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat refresh_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "refresh_summary.json not produced (guardrail/validation failure -- see log)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Does the tree refresh just produced agree with itself? (issue #20)
      # --untracked because the walk has to see the working tree as it stands:
      # the rebuilt items are not committed yet, so `git ls-files` would list
      # the pruned ones and miss the new ones.
      # --exit-zero because the PR is worth opening either way -- the findings
      # go into its body, and "Fail on consistency findings" below reddens the
      # run once the diff a human needs to look at is on GitHub.
      - name: Check catalog consistency
        id: consistency
        if: steps.refresh.outputs.changed == 'true'
        run: |
          pixi run check-catalog --untracked --exit-zero \
            --json check_report.json --markdown check-summary.md
          n=$(jq '.findings | length' check_report.json)
          echo "findings=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" != "0" ]; then
            echo "::warning::$n internal-consistency findings in the refreshed catalog"
            printf '\n---\n\n' >> pr_body.md
            cat check-summary.md >> pr_body.md
          fi

      - name: Warn on per-project build failures
        if: steps.refresh.outputs.n_failures != '' && steps.refresh.outputs.n_failures != '0'
        run: |
          echo "::warning::${{ steps.refresh.outputs.n_failures }} project build(s) failed (likely WESM name mismatch -- see scripts/create_static_stac.py onemeter_folder_to_wesm)"

      - name: Open pull request
        if: steps.refresh.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            catalog
            collections.txt
          branch: update-catalog
          delete-branch: true
          commit-message: "Refresh catalog: ${{ steps.refresh.outputs.subject }}"
          title: "Update catalog (${{ steps.refresh.outputs.title }})"
          # rendered by refresh_catalog.py --pr-body: headline counts plus a
          # per-collection table (too long for a GITHUB_OUTPUT variable), with
          # the consistency findings appended when there are any
          body-path: pr_body.md

      # after the PR exists, so a broken refresh is both visible and reviewable
      - name: Fail on consistency findings
        if: steps.consistency.outputs.findings != '' && steps.consistency.outputs.findings != '0'
        run: |
          echo "::error::the refreshed catalog is not internally consistent (${{ steps.consistency.outputs.findings }} findings) -- see the PR body and the job summary"
          exit 1
