# Publish release assets whenever the catalog content on main changes
# (i.e. when an update-catalog PR merges, or catalog edits are pushed).
#
# Rebuilds catalog.parquet from the static catalog, checks the row count
# against the item-file count, regenerates the catalog.gti wrapper, and
# publishes a dated release (vYYYY.MM.DD) so that
# releases/latest/download/catalog.parquet always serves the current catalog
# (this is what downstream consumers like SlideRule AMS ingest).
name: Release Catalog Assets

on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true

      - name: Build STAC-GeoParquet + GTI
        run: |
          ulimit -n 65536
          pixi run catalog2geoparquet
          # sanity: parquet row count must equal the catalog item-file count
          pixi run python - <<'EOF'
          from pathlib import Path
          import pyarrow.parquet as pq
          n_parquet = pq.ParquetFile("catalog.parquet").metadata.num_rows
          n_items = sum(1 for p in Path("catalog").glob("*/*.json")
                        if p.name != "collection.json")
          print(f"parquet rows: {n_parquet}, catalog item files: {n_items}")
          assert n_parquet == n_items, "parquet row count != catalog item count"
          EOF
          cat > catalog.gti <<'EOF'
          <GDALTileIndexDataset>
              <!-- Minimal metadata for GDAL to avoid reading a first .tif -->
              <IndexDataset>catalog.parquet</IndexDataset>
              <BandCount>1</BandCount>
              <DataType>Float32</DataType>
              <SRS>EPSG:4326</SRS>
              <Resampling>Bilinear</Resampling>
              <NoData>-999999</NoData>
              <!-- approximately, 1m spacing in degrees for CONUS -->
              <ResX>0.000009</ResX>
              <ResY>0.000009</ResY>
              <LocationField>assets.elevation.href</LocationField>
          </GDALTileIndexDataset>
          EOF

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          N=1
          while gh release view "$TAG" >/dev/null 2>&1; do
            N=$((N + 1))
            TAG="v$(date -u +%Y.%m.%d).$N"
          done
          SUBJECT="$(git log -1 --format=%s)"
          gh release create "$TAG" catalog.parquet catalog.gti \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Automated catalog release for: $SUBJECT

          See the commit history for the catalog diff."
