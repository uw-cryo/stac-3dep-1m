# Publish release assets on a monthly cadence (or on demand) so that
# releases/latest/download/catalog.parquet tracks the catalog without a
# release per merge (this is the input downstream consumers like SlideRule
# AMS build their databases from).
#
# Rebuilds catalog.parquet from the static catalog, checks the row count
# against the item-file count, regenerates the catalog.gti wrapper, and
# publishes a dated CalVer release (vYYYY.MM.DD). Skips cleanly when the
# catalog is unchanged since the latest release. For a quarterly cadence,
# change the cron to "17 6 1 1,4,7,10 *".
name: Release Catalog Assets

on:
  schedule:
    - cron: "17 6 1 * *"  # monthly: 1st, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # full history + tags: the skip gate diffs against the commit of
          # the latest release tag
          fetch-depth: 0
          fetch-tags: true

      - name: Skip if catalog unchanged since latest release
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the latest release to a commit via its TAG, not
          # targetCommitish: releases cut from the GitHub UI store a branch
          # NAME there (v0.3's is the literal string "main", which would
          # compare HEAD to HEAD and always skip). No previous release, or a
          # tag that doesn't resolve, counts as changed -> publish.
          LAST_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || echo '')"
          LAST_COMMIT=""
          if [ -n "$LAST_TAG" ]; then
            LAST_COMMIT="$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || echo '')"
          fi
          if [ -z "$LAST_COMMIT" ]; then
            echo "no previous release (or tag '$LAST_TAG' unresolvable); publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$LAST_COMMIT" HEAD -- catalog/; then
            echo "catalog unchanged since release $LAST_TAG ($LAST_COMMIT); skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "catalog changed since release $LAST_TAG ($LAST_COMMIT); publishing"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: prefix-dev/setup-pixi@v0.10.1
        if: steps.changed.outputs.changed == 'true'
        with:
          cache: true

      # Cheap gate before the expensive build: the parquet inherits whatever
      # inconsistency the catalog has, and a mixed item schema or a collection
      # nothing links to becomes a published artifact consumers build databases
      # from. ~20 s against ~15 min for the parquet (issue #20).
      - name: Check catalog consistency
        if: steps.changed.outputs.changed == 'true'
        run: pixi run check-catalog --markdown check-summary.md

      - name: Build STAC-GeoParquet + GTI
        if: steps.changed.outputs.changed == 'true'
        run: |
          ulimit -n 65536
          pixi run catalog2geoparquet
          cat > catalog.gti <<'EOF'
          <GDALTileIndexDataset>
              <!-- Minimal metadata for GDAL to avoid reading a first .tif -->
              <IndexDataset>catalog.parquet</IndexDataset>
              <BandCount>1</BandCount>
              <DataType>Float32</DataType>
              <SRS>EPSG:4326</SRS>
              <Resampling>Bilinear</Resampling>
              <NoData>-999999</NoData>
              <!-- approximately, 1m spacing in degrees for CONUS -->
              <ResX>0.000009</ResX>
              <ResY>0.000009</ResY>
              <LocationField>assets.elevation.href</LocationField>
          </GDALTileIndexDataset>
          EOF

      # The artifact this release exists to publish, checked against the items
      # it was walked from: row count and id sets both ways, then every row's
      # collection, href (the GTI LocationField), file:size/checksum, proj:code,
      # proj:shape, datetimes, bbox and geometry. This replaces the row-count
      # assert that used to live in the build step -- a count cannot see a row
      # whose href or footprint drifted, and the href is what consumers read.
      - name: Check parquet against the catalog
        if: steps.changed.outputs.changed == 'true'
        run: |
          pixi run check-catalog --check parquet --parquet catalog.parquet \
            --markdown parquet-summary.md

      - name: Tag and release
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          N=1
          while gh release view "$TAG" >/dev/null 2>&1; do
            N=$((N + 1))
            TAG="v$(date -u +%Y.%m.%d).$N"
          done
          SUBJECT="$(git log -1 --format=%s)"
          gh release create "$TAG" catalog.parquet catalog.gti \
            --target "$(git rev-parse HEAD)" \
            --title "$TAG" \
            --notes "Automated catalog release for: $SUBJECT

          See the commit history for the catalog diff."
