name: Feature request
description: A change to the catalog, its published artifacts, or the scripts that build them.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short: the problem, then the proposal. Leave alternatives you won't pursue out.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today, or what goes wrong. One to three sentences, with a concrete example.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you want, and how we'd know it works. Say if it touches all ~125k items (they must stay uniform), the GTI `LocationField`, or release asset names.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. A runnable snippet, measurements, links to related issues in this repo.

