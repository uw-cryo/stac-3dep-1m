[workspace]
authors = ["Scott Henderson <3924836+scottyhq@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "stac-3dep-1m"
platforms = ["osx-arm64","linux-64"]
version = "0.1.0"

[tasks]
create-all = { cmd = "python scripts/create_all.py", description = "Create static STAC for every 3DEP 1m S3 project folder that isn't already in catalog/" }
create-stac = { cmd = "python scripts/create_static_stac.py", description = "Create a static STAC catalog+collection for a single project or WESM workunit" }
collection2geoparquet = { cmd = "python scripts/collection2geoparquet.py", description = "Convert one collection.json and its items to a STAC-GeoParquet file" }
catalog2geoparquet = { cmd = "python scripts/catalog2geoparquet.py catalog/catalog.json catalog.parquet", description = "Convert the full root catalog to a single STAC-GeoParquet file" }
refresh = { cmd = "python scripts/refresh_catalog.py", description = "Diff catalog/ against current S3 holdings and WESM; rebuild new/changed projects, prune deleted ones, refresh drifted metadata, validate" }
backfill-file-metadata = { cmd = "python scripts/backfill_file_metadata.py", description = "Stamp file:size + file:checksum onto existing catalog items from S3 object metadata (idempotent; no titiler)" }
audit = { cmd = "python scripts/audit_catalog.py", description = "Re-derive sampled items from their current tiles through titiler and diff against the catalog: would a rebuild change them? (read-only; 3 tiles per collection by default; --part i/N splits one audit across parallel runs)" }
catalog2hive = { cmd = "python scripts/catalog2hive.py", description = "Write the catalog as hive-partitioned STAC-GeoParquet (collection=<id>/part0.parquet)" }
create-collection-parquets = { cmd = "python scripts/create_collection_parquets.py", description = "Write a .parquet next to each collection.json under a catalog directory" }
sort-collection-links = { cmd = "python scripts/sort_collection_links.py", description = "Reorder committed collection.json item links + proj:code into the order a rebuild now produces (idempotent; no titiler)" }
update-root-catalog = { cmd = "python scripts/update_root_catalog.py", description = "Add any new child collections to the top-level catalog.json" }
list-collections = { cmd = "ls -1d catalog/*/ | sed 's|catalog/||;s|/||' > collections.txt", description = "Write the list of collection IDs in catalog/ to collections.txt" }
ruff = { cmd = "ruff check --fix ; ruff format", description = "Lint with autofix and format scripts/ using ruff (scope set in ruff.toml)" }
lint = { cmd = "ruff check --output-format=github && ruff format --diff", description = "Check lint + formatting without modifying anything; what CI gates PRs on" }

[dependencies]
arro3-core = ">=0.6.3,<0.7"
cloudpathlib-s3 = ">=0.20.0,<0.21"
duckdb = ">=1.3.2,<2"
gdal = ">=3.12.0,<4"
geopandas = ">=1.0.1,<2"
ipykernel = ">=6.30.1,<7"
ipython = ">=9.0.0,<10"
jsonschema = ">=4.23.0,<5"
libgdal-arrow-parquet = ">=3.10.2,<4"
#libgfortran5 = ">=14.2.0"
obstore = ">=0.8.1,<0.9"
pyarrow = ">=19.0.1,<20"
python = ">=3.13.2,<3.14"
pystac = ">=1.12.1,<2"
ruff = ">=0.9.7,<0.10"
rustac = ">=0.9.8,<0.10"
cartopy = ">=0.25.0,<0.26"
rioxarray = ">=0.22.0,<0.23"
cql2 = "*"

